<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Tilt+Neon&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stage.css">
<style>
  .stage { color: var(--ink); background: #fff; }
  .s1 { background: #fff; display: grid; place-items: center; }
  .s1 .h { font-size: 200px; color: var(--ink); text-align: center; }
  .s1 .dot { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: var(--cyan); left: 50%; top: 700px; margin-left: -19px; }
  .clip .shade { background: linear-gradient(90deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.6) 38%, rgba(255,255,255,0) 64%); }
  .clip.right .shade { background: linear-gradient(270deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.6) 38%, rgba(255,255,255,0) 64%); }
  .copy { position: absolute; left: 130px; top: 50%; transform: translateY(-50%); width: 860px; color: var(--ink); }
  .right .copy { left: auto; right: 130px; text-align: right; }
  .copy .eyebrow { color: var(--cyan-link); }
  .big { font-size: 180px; margin-top: 18px; } .big .u { font-size: 90px; color: var(--cyan-link); margin-left: 10px; }
  .mid { font-size: 120px; margin-top: 18px; }
  .sub { font-size: 38px; color: var(--ink-2); margin-top: 22px; font-weight: 500; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .end { background: radial-gradient(ellipse at 50% 42%, #ffffff 0%, var(--paper-2) 70%); }
  .end .prod { position: absolute; left: 50%; top: 40%; width: 1080px; transform: translate(-50%, -50%); }
  .end .name { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 150px; color: var(--ink); }
  .end .line { position: absolute; left: 50%; width: 120px; margin-left: -60px; top: 875px; }
  .end .price { position: absolute; left: 0; right: 0; top: 905px; text-align: center; font-size: 40px; font-weight: 500; color: var(--ink); }
  .end .price b { color: var(--cyan-link); font-weight: 600; }
  .end .endmark { color: var(--ink-2); }
</style></head>
<body><div class="stage" id="stage">
  <section class="scene s1" id="s1"><h1 class="h" id="hook">Light to carry.</h1><div class="dot" id="dot"></div></section>
  <section class="scene clip" id="s2"><video class="fill" src="media/sipag-desk.mp4"></video><div class="shade"></div>
    <div class="copy"><p class="eyebrow">Weight</p><p class="h big"><span id="kg">0.00</span><span class="u">kg</span></p><p class="sub">Metal lid and base · 16.85 mm thin</p></div></section>
  <section class="scene clip right" id="s3"><video class="fill" src="media/sipag-keys.mp4"></video><div class="shade"></div>
    <div class="copy"><p class="eyebrow">Battery</p><p class="h big"><span id="hrs">0</span><span class="u">hrs</span></p><p class="sub">Up to 13 hours · charges over USB-C</p></div></section>
  <section class="scene clip" id="s4"><video class="fill" src="media/sipag-lid.mp4"></video><div class="shade"></div>
    <div class="copy"><p class="eyebrow">Built for the workday</p><p class="h mid">Core Ultra 5</p><p class="sub">Intel Core Ultra 5 125U · 14" Full HD</p></div></section>
  <section class="scene end" id="s5"><img class="prod" id="prod" src="../assets/img/products/sipag-i.webp">
    <h2 class="np name" id="name">SIPAG I</h2><div class="bar line" id="line"></div>
    <p class="price" id="price">₱49,900 <span style="color:var(--ink-2)">· US$699 worldwide</span> · <b>Pre-order at naga.industries</b></p>
    <div class="endmark" id="endmark"><img src="../assets/img/naga-wordmark-black.png" alt=""><span>Sulong.</span></div></section>
  <div class="flash" id="flash"></div>
</div>
<script src="../assets/vendor/gsap.min.js"></script>
<script src="stage.js"></script>
<script src="common.js"></script>
<script>
  const P = window.PROMO, B = 2.4, tl = gsap.timeline({ paused: true }); P.tl = tl; const F = FX(tl), $ = (s) => document.querySelector(s);
  F.show('#s1', 0);
  P.words($('#hook')).forEach((w, i) => tl.from(w, { scale: .3, y: 60, opacity: 0, duration: .45, ease: 'back.out(2.2)' }, i * .6));
  tl.from('#dot', { scale: 0, duration: .4, ease: 'back.out(3)' }, 1.8); tl.to('#dot', { y: -30, duration: .2, yoyo: true, repeat: 1, ease: 'power1.out' }, 2.05);
  F.hide('#s1', B);
  [['#s2', 1], ['#s3', 2], ['#s4', 3]].forEach(([s, k]) => { F.clip(s, B * k, B); F.flash(B * k, .35); F.rise(s + ' .copy > *', B * k + .12); });
  P.count(tl, $('#kg'), 1.30, B + .25, 1.2, (v) => v.toFixed(2));
  P.count(tl, $('#hrs'), 13, B * 2 + .25, 1.2);
  const E = B * 4; F.show('#s5', E); F.flash(E, .6);
  tl.from('#prod', { scale: 1.12, y: 30, opacity: 0, filter: 'blur(10px)', duration: 1, ease: 'power3.out' }, E);
  P.chars($('#name')).forEach((c, i) => tl.from(c, { y: 80, scale: .4, opacity: 0, duration: .5, ease: 'back.out(2.4)' }, E + .6 + i * .06));
  tl.to('#name', { y: -16, duration: .18, yoyo: true, repeat: 1, ease: 'power1.out' }, E + 1.3);
  tl.from('#line', { scaleX: 0, duration: .4, ease: 'power3.out' }, E + 1.2);
  F.rise('#price', E + 1.8); F.rise('#endmark', E + 2.4); F.outro(P.duration);
  P.audio = { music: { src: 'naga-ambient-gabi-trap-bed-loop.mp3', from: 18.32, gain: 1 }, fadeOut: 1.4, hits: [
    { src: 'naga-hit-kulintang-shimmer.mp3', at: 1.8 - 0.74, gain: .8 },
    { src: 'naga-logo-kudyapi-signature.mp3', at: E + .6 - .61, gain: .9 } ] };
</script></body></html>
