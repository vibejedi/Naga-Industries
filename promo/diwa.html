<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Tilt+Neon&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stage.css">
<style>
  .s1 { background: #000; }
  .ring { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; }
  .ring circle { fill: none; stroke: var(--cyan); stroke-width: 2; filter: drop-shadow(0 0 10px rgba(0,217,245,.7)); }
  .orb { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; }
  .orb i { position: absolute; left: 50%; top: -9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 22px var(--cyan); }
  .s1 .h { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 120px; font-weight: 600; }
  .clip .shade { background: linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 40%, rgba(0,0,0,0) 66%); }
  .copy { position: absolute; left: 130px; top: 50%; transform: translateY(-50%); width: 820px; }
  .mid { font-size: 120px; margin-top: 18px; font-weight: 600; } .sub { font-size: 38px; color: var(--onvoid-2); margin-top: 22px; font-weight: 500; }
  .s3 { background: radial-gradient(ellipse at 36% 50%, #062a31 0%, #000 60%); }
  .s3 .baku { position: absolute; left: 300px; top: 120px; height: 840px; }
  .s3 .copy { left: auto; right: 160px; width: 760px; }
  .flash { position: absolute; inset: 0; background: var(--cyan); opacity: 0; mix-blend-mode: screen; }
  .end { background: radial-gradient(ellipse at 50% 44%, #062a31 0%, #000 62%); }
  .end .prod { position: absolute; left: 50%; top: 40%; width: 1040px; transform: translate(-50%, -50%); }
  .end .name { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 160px; text-shadow: 0 0 40px rgba(0,217,245,.4); }
  .end .price { position: absolute; left: 0; right: 0; top: 905px; text-align: center; font-size: 40px; font-weight: 500; }
  .end .price b { color: var(--cyan); font-weight: 600; }
</style></head>
<body><div class="stage" id="stage">
  <section class="scene s1" id="s1"><svg class="ring" viewBox="0 0 760 760"><circle id="circ" cx="380" cy="380" r="370" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><div class="orb" id="orb"><i></i></div>
    <h1 class="h" id="hook">A mind that never sleeps.</h1></section>
  <section class="scene clip" id="s2"><video class="fill" src="media/diwa-desk.mp4"></video><div class="shade"></div>
    <div class="copy"><p class="eyebrow">AI mini PC</p><p class="h mid">Small box. Big mind.</p><p class="sub">Your own AI, running at home</p></div></section>
  <section class="scene s3" id="s3"><img class="baku" id="baku" src="../assets/img/baku.webp">
    <div class="copy"><p class="eyebrow">Meet Baku</p><p class="h mid">Built in.</p><p class="sub" id="pts">Private by design. Works offline. Speaks every language.</p></div></section>
  <section class="scene end" id="s4"><img class="prod" id="prod" src="../assets/img/products/diwa.webp">
    <h2 class="np name" id="name">DIWA</h2>
    <p class="price" id="price">Coming soon · <b>Reserve at naga.industries</b></p>
    <div class="endmark" id="endmark"><img src="../assets/img/naga-wordmark-white.png" alt=""><span>Sulong.</span></div></section>
  <div class="flash" id="flash"></div><div class="grain"></div>
</div>
<script src="../assets/vendor/gsap.min.js"></script>
<script src="stage.js"></script>
<script src="common.js"></script>
<script>
  const P = window.PROMO, tl = gsap.timeline({ paused: true }); P.tl = tl; const F = FX(tl), $ = (s) => document.querySelector(s);
  F.show('#s1', 0);
  tl.to('#circ', { strokeDashoffset: 0, duration: 3.2, ease: 'sine.inOut' }, 0);
  tl.fromTo('#orb', { rotation: -90 }, { rotation: 270, duration: 3.6, ease: 'sine.inOut' }, 0);
  F.drift(P.words($('#hook')), .5, 1.1);
  F.hide('#s1', 3.6);
  F.clip('#s2', 3.6, 4.2, .2, 1.06); F.flash(3.6, .25); F.drift('#s2 .copy > *', 3.9);
  const S3 = 7.8; F.show('#s3', S3); F.flash(S3, .25);
  tl.from('#baku', { y: 60, opacity: 0, filter: 'blur(14px)', duration: 1.2, ease: 'sine.out' }, S3);
  tl.to('#baku', { y: -18, duration: 1.5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, S3 + 1.2);
  F.drift('#s3 .copy > *', S3 + .4); F.hide('#s3', 10.8);
  const E = 10.8; F.show('#s4', E); F.flash(E, .4);
  tl.from('#prod', { scale: 1.1, opacity: 0, filter: 'blur(12px)', duration: 1.4, ease: 'sine.out' }, E);
  P.chars($('#name')).forEach((c, i) => tl.from(c, { rotation: -65, transformOrigin: '50% 320%', opacity: 0, filter: 'blur(6px)', duration: 1.6, ease: 'sine.inOut' }, E + .5 + i * .2));
  F.drift('#price', E + 2.2); F.drift('#endmark', E + 2.8); F.outro(P.duration);
  P.audio = { music: { src: 'naga-ambient-bakunawa-night-loop.mp3', from: 36.08, gain: 1 }, fadeIn: .8, fadeOut: 1.6, hits: [
    { src: 'naga-hit-kulintang-shimmer.mp3', at: 3.6 - .74, gain: .7 },
    { src: 'naga-logo-gong-bloom.mp3', at: E + 1.2 - 2.17, gain: .9 } ] };
</script></body></html>
